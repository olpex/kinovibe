<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КіноВайб | Преміальний підбір фільмів</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#f97316',   /* Теплий помаранчевий */
                        secondary: '#fbbf24', /* Теплий бурштиновий */
                        accent: '#f43f5e',    /* М'який червоний/рожевий */
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* Теплий світлий бекграунд */
            background-color: #fdfaf6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1f2937;
        }

        /* Glassmorphism для світлої теми */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
        }

        /* Елегантний скролбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, #f97316, #f43f5e); 
            border-radius: 10px; 
        }

        /* Спінер */
        .loader {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-block;
            border-top: 4px solid rgba(249, 115, 22, 0.2);
            border-right: 4px solid transparent;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        .loader::after {
            content: '';  
            box-sizing: border-box;
            position: absolute;
            left: 0;
            top: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-bottom: 4px solid #f97316;
            border-left: 4px solid transparent;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Кастомний чекбокс */
        .custom-checkbox input:checked + div {
            background-color: #f97316;
            border-color: #f97316;
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }

        /* Картка фільму */
        .movie-card {
            aspect-ratio: 2/3;
            perspective: 1000px;
        }
        .movie-card-inner {
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.2);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .movie-card:hover .movie-card-inner {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(249, 115, 22, 0.3);
        }
        .movie-overlay {
            background: linear-gradient(to top, rgba(15,15,20,0.95) 0%, rgba(15,15,20,0.8) 50%, rgba(15,15,20,0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .movie-card:hover .movie-overlay {
            opacity: 1;
        }
        .movie-content {
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
        }
        .movie-card:hover .movie-content {
            transform: translateY(0);
            opacity: 1;
        }
        
        .glow-text {
            text-shadow: 0 2px 15px rgba(249, 115, 22, 0.3);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col font-light">

    <!-- Абстрактні бекграунд-сфери -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-primary/10 blur-[100px] animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[35vw] h-[35vw] rounded-full bg-secondary/10 blur-[100px] animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[50vw] h-[50vw] rounded-full bg-accent/10 blur-[100px] animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Шапка -->
    <header class="glass-panel sticky top-0 z-40 border-b border-gray-200">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center max-w-7xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-accent flex items-center justify-center shadow-lg shadow-primary/20">
                    <span class="text-white text-xl">🎬</span>
                </div>
                <h1 class="text-2xl font-bold tracking-wide text-gray-800">
                    Кіно<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent">Вайб</span>
                </h1>
            </div>
            <!-- Налаштування та ключі видалено за проханням -->
        </div>
    </header>

    <!-- Головний контент -->
    <main class="flex-grow container mx-auto px-4 py-12 max-w-7xl flex flex-col items-center">
        
        <!-- Hero Section -->
        <div class="text-center max-w-4xl mx-auto mb-16 px-4 animate-float">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/60 mb-8 border border-white shadow-sm">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                </span>
                <span class="text-sm font-medium text-gray-600">ШІ на базі Llama 3 & Mistral</span>
            </div>
            
            <h2 class="text-5xl md:text-7xl font-extrabold text-gray-900 mb-6 tracking-tight leading-tight">
                Знайдіть фільм, який <br class="hidden md:block">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent glow-text">зігріє цей вечір</span>
            </h2>
            <p class="text-lg md:text-xl text-gray-600 max-w-2xl mx-auto font-light">
                Забудьте про довгі пошуки. Розкажіть свій настрій чи атмосферу, і наш алгоритм миттєво збере стрічки до вашого смаку.
            </p>
        </div>

        <!-- Форма пошуку -->
        <section id="searchSection" class="w-full max-w-3xl glass-panel rounded-3xl p-6 md:p-10 mb-16 scroll-mt-32 relative overflow-hidden">
            <!-- Блік на формі -->
            <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-white to-transparent opacity-80"></div>
            
            <form id="searchForm" class="flex flex-col gap-8 relative z-10">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Вибір року -->
                    <div class="flex flex-col gap-3 relative" id="yearDropdownContainer">
                        <label class="text-sm font-medium text-gray-500 uppercase tracking-widest pl-1">Рік виходу</label>
                        <button type="button" id="yearDropdownBtn" class="w-full text-left bg-white/80 hover:bg-white text-gray-800 rounded-2xl p-4 outline-none border border-white focus:border-primary/50 focus:ring-2 focus:ring-primary/20 shadow-sm transition-all flex justify-between items-center group">
                            <span id="yearSelectedText" class="truncate font-medium">Будь-який рік</span>
                            <svg class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <!-- Меню -->
                        <div id="yearDropdownMenu" class="hidden absolute top-[100%] left-0 w-full mt-2 bg-white/95 border border-gray-100 rounded-2xl shadow-xl z-30 max-h-60 overflow-y-auto backdrop-blur-xl">
                            <div class="p-2 flex flex-col gap-1" id="yearCheckboxList">
                                <label class="custom-checkbox flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer text-gray-700 hover:text-gray-900 transition-colors group">
                                    <div class="relative flex items-center">
                                        <input type="checkbox" value="any" class="peer sr-only" checked>
                                        <div class="w-5 h-5 border border-gray-300 rounded flex items-center justify-center transition-colors group-hover:border-primary">
                                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                    <span class="select-none font-medium">Будь-який рік</span>
                                </label>
                                <!-- Роки генеруються через JS -->
                            </div>
                        </div>
                    </div>

                    <!-- Вибір жанру -->
                    <div class="flex flex-col gap-3 relative" id="genreDropdownContainer">
                        <label class="text-sm font-medium text-gray-500 uppercase tracking-widest pl-1">Жанр</label>
                        <button type="button" id="genreDropdownBtn" class="w-full text-left bg-white/80 hover:bg-white text-gray-800 rounded-2xl p-4 outline-none border border-white focus:border-primary/50 focus:ring-2 focus:ring-primary/20 shadow-sm transition-all flex justify-between items-center group">
                            <span id="genreSelectedText" class="truncate font-medium">Будь-який жанр</span>
                            <svg class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <!-- Меню -->
                        <div id="genreDropdownMenu" class="hidden absolute top-[100%] left-0 w-full mt-2 bg-white/95 border border-gray-100 rounded-2xl shadow-xl z-30 max-h-60 overflow-y-auto backdrop-blur-xl">
                            <div class="p-2 flex flex-col gap-1" id="genreCheckboxList">
                                <label class="custom-checkbox flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer text-gray-700 hover:text-gray-900 transition-colors group">
                                    <div class="relative flex items-center">
                                        <input type="checkbox" value="any" class="peer sr-only" checked>
                                        <div class="w-5 h-5 border border-gray-300 rounded flex items-center justify-center transition-colors group-hover:border-primary">
                                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                    <span class="select-none font-medium">Будь-який жанр</span>
                                </label>
                                <!-- JS додає жанри -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Побажання -->
                <div class="flex flex-col gap-3">
                    <label for="wishesInput" class="text-sm font-medium text-gray-500 uppercase tracking-widest pl-1">
                        Детальні побажання <span class="text-accent">*</span>
                    </label>
                    <textarea id="wishesInput" rows="3" placeholder="Наприклад: затишний вечір, хочеться чогось веселого або доброго про друзів і подорожі..." class="w-full bg-white/80 hover:bg-white text-gray-800 rounded-2xl p-5 outline-none border border-white focus:border-accent/50 focus:ring-2 focus:ring-accent/20 shadow-sm transition-all resize-y placeholder-gray-400 font-light text-lg"></textarea>
                </div>

                <!-- Кнопка -->
                <button type="submit" class="relative overflow-hidden group border-none text-white font-bold py-4 px-8 rounded-2xl shadow-lg shadow-primary/20 transform transition-all active:scale-95 text-xl w-full flex justify-center items-center gap-3">
                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-primary via-accent to-primary bg-[length:200%_auto] hover:bg-[position:right_center] transition-all duration-500 z-0"></div>
                    <span class="relative z-10 transition-colors duration-300 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                        Почати магію підбору
                    </span>
                </button>
            </form>
        </section>

        <!-- Індикатор завантаження -->
        <div id="loader" class="hidden flex-col items-center justify-center py-16 gap-6 w-full fade-in">
            <span class="loader"></span>
            <p id="loaderText" class="text-gray-600 animate-pulse text-xl font-medium tracking-wide">ШІ генерує ідеальну підбірку...</p>
        </div>

        <!-- Повідомлення про помилки -->
        <div id="errorMessage" class="hidden w-full max-w-3xl bg-red-50 border border-red-200 text-red-600 p-6 rounded-2xl mb-12 text-center flex items-center justify-center gap-3 shadow-sm"></div>

        <!-- Сітка результатів -->
        <section id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full">
            <!-- Картки генеруються сюди -->
        </section>

    </main>

    <!-- Шаблон картки фільму (схований) -->
    <template id="movieCardTemplate">
        <article class="movie-card relative w-full h-full rounded-2xl group cursor-pointer">
            <div class="movie-card-inner relative w-full h-full rounded-2xl overflow-hidden bg-gray-900 border border-transparent">
                <!-- Постер -->
                <img src="" alt="Poster" class="card-poster absolute inset-0 w-full h-full object-cover z-0">
                
                <!-- Завжди видимі бейджі -->
                <div class="absolute top-4 right-4 z-20 flex flex-col gap-2 items-end drop-shadow-md">
                    <div class="bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-1.5">
                        <span class="text-secondary text-xs">★</span>
                        <span class="card-rating font-bold text-white text-sm"></span>
                    </div>
                    <div class="bg-black/70 backdrop-blur-md px-3 py-1 rounded-full border border-white/10">
                        <span class="card-year font-bold text-gray-300 text-xs tracking-wider"></span>
                    </div>
                </div>

                <!-- Градієнт який з'являється при наведенні -->
                <div class="movie-overlay absolute inset-0 z-10 flex flex-col justify-end p-6">
                    <div class="movie-content">
                        <h3 class="card-title text-2xl font-bold text-white mb-2 leading-tight drop-shadow-lg"></h3>
                        <p class="card-plot text-gray-300 text-sm line-clamp-4 mb-6 leading-relaxed font-light drop-shadow-md"></p>
                        
                        <div class="flex flex-col gap-3">
                            <!-- Кнопка IMDb -->
                            <a href="#" target="_blank" class="card-imdb-btn bg-white/10 hover:bg-white/20 backdrop-blur-lg border border-white/20 text-white font-medium py-2.5 px-4 rounded-xl text-center transition-colors text-sm flex justify-center items-center gap-2">
                                <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M22.09 10.3c.09-.81-.15-1.42-.71-1.84-.57-.42-1.3-.64-2.21-.64h-3.41v8.36h1.76V14h1.16l1.39 2.18h2.09l-1.63-2.48c.62-.21 1.07-.54 1.34-.98.28-.45.42-.99.42-1.62-.01-.36-.07-.63-.2-1.02zM19.4 12.6h-1.8v-1.6h1.8c.45 0 .76.12.94.35.17.23.26.54.26.93 0 .37-.09.67-.27.88-.17.21-.48.33-.93.34zm-8.89 3.58h1.76V7.82h-1.76v8.36zm-4.32 0h1.76v-5.6l2.1 5.6h1.6V7.82h-1.76v5.61l-2.11-5.61H4.43v8.36zM1.86 7.82H.1v8.36h1.76V7.82z"/></svg>
                                IMDb Сторінка
                            </a>
                            <!-- Кнопка На перегляд -->
                            <a href="#" target="_blank" class="card-watch-btn bg-gradient-to-r from-primary to-accent hover:from-primary/90 hover:to-accent/90 text-white font-bold py-3 px-4 rounded-xl text-center transition-all transform hover:scale-105 active:scale-95 text-sm shadow-[0_0_20px_rgba(249,115,22,0.4)] flex justify-center items-center gap-2">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                На перегляд
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </template>

    <script>
        const ELEMENTS = {
            yearDropdownBtn: document.getElementById('yearDropdownBtn'),
            yearDropdownMenu: document.getElementById('yearDropdownMenu'),
            yearCheckboxList: document.getElementById('yearCheckboxList'),
            yearSelectedText: document.getElementById('yearSelectedText'),
            genreDropdownBtn: document.getElementById('genreDropdownBtn'),
            genreDropdownMenu: document.getElementById('genreDropdownMenu'),
            genreCheckboxList: document.getElementById('genreCheckboxList'),
            genreSelectedText: document.getElementById('genreSelectedText'),
            searchForm: document.getElementById('searchForm'),
            wishesInput: document.getElementById('wishesInput'),
            loader: document.getElementById('loader'),
            loaderText: document.getElementById('loaderText'),
            errorMessage: document.getElementById('errorMessage'),
            resultsGrid: document.getElementById('resultsGrid'),
            template: document.getElementById('movieCardTemplate')
        };

        const OMDb_KEY = '541f2a60'; // Вшитий ключ

        const GENRES = ["Комедія", "Драма", "Фантастика", "Екшн / Бойовик", "Жахи", "Трилер", "Мелодрама", "Кримінал", "Детектив", "Анімація", "Фентезі"];

        function init() {
            populateYears();
            populateGenres();
            setupDropdowns();
        }

        function populateYears() {
            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= 1960; y--) {
                const label = document.createElement('label');
                label.className = "custom-checkbox flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer text-gray-700 hover:text-gray-900 transition-colors group";
                label.innerHTML = `
                    <div class="relative flex items-center">
                        <input type="checkbox" value="${y}" class="peer sr-only">
                        <div class="w-5 h-5 border border-gray-300 rounded flex items-center justify-center transition-colors group-hover:border-primary">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                    <span class="select-none font-medium">${y}</span>
                `;
                ELEMENTS.yearCheckboxList.appendChild(label);
            }
        }

        function populateGenres() {
            GENRES.forEach(genre => {
                const label = document.createElement('label');
                label.className = "custom-checkbox flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer text-gray-700 hover:text-gray-900 transition-colors group";
                label.innerHTML = `
                    <div class="relative flex items-center">
                        <input type="checkbox" value="${genre}" class="peer sr-only">
                        <div class="w-5 h-5 border border-gray-300 rounded flex items-center justify-center transition-colors group-hover:border-primary">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                    <span class="select-none font-medium">${genre}</span>
                `;
                ELEMENTS.genreCheckboxList.appendChild(label);
            });
        }

        function setupDropdowns() {
            ELEMENTS.yearDropdownBtn.addEventListener('click', () => {
                ELEMENTS.yearDropdownMenu.classList.toggle('hidden');
                ELEMENTS.genreDropdownMenu.classList.add('hidden');
            });
            ELEMENTS.genreDropdownBtn.addEventListener('click', () => {
                ELEMENTS.genreDropdownMenu.classList.toggle('hidden');
                ELEMENTS.yearDropdownMenu.classList.add('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#yearDropdownContainer')) ELEMENTS.yearDropdownMenu.classList.add('hidden');
                if (!e.target.closest('#genreDropdownContainer')) ELEMENTS.genreDropdownMenu.classList.add('hidden');
            });
            setupCheckboxLogic(ELEMENTS.yearCheckboxList, ELEMENTS.yearSelectedText, 'Будь-який рік');
            setupCheckboxLogic(ELEMENTS.genreCheckboxList, ELEMENTS.genreSelectedText, 'Будь-який жанр');
        }

        function setupCheckboxLogic(listContainer, textElement, defaultText) {
            listContainer.addEventListener('change', (e) => {
                if (e.target.tagName !== 'INPUT') return;
                const checkboxes = Array.from(listContainer.querySelectorAll('input[type="checkbox"]'));
                const anyCb = checkboxes.find(cb => cb.value === 'any');
                const otherCbs = checkboxes.filter(cb => cb.value !== 'any');
                
                if (e.target === anyCb && anyCb.checked) {
                    otherCbs.forEach(cb => cb.checked = false);
                } else if (e.target !== anyCb && e.target.checked) {
                    anyCb.checked = false;
                }
                
                const checkedList = checkboxes.filter(cb => cb.checked);
                if (checkedList.length === 0) anyCb.checked = true;
                
                const selectedValues = checkboxes.filter(cb => cb.checked && cb.value !== 'any').map(cb => cb.value);
                if (selectedValues.length === 0) textElement.textContent = defaultText;
                else if (selectedValues.length <= 2) textElement.textContent = selectedValues.join(', ');
                else textElement.textContent = `Обрано: ${selectedValues.length}`;
            });
        }

        function showError(msg) {
            ELEMENTS.errorMessage.innerHTML = `
                <svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div class="text-left text-red-600">${msg}</div>
            `;
            ELEMENTS.errorMessage.classList.remove('hidden');
            ELEMENTS.loader.classList.add('hidden');
            ELEMENTS.loader.classList.remove('flex');
        }
        function hideError() {
            ELEMENTS.errorMessage.classList.add('hidden');
            ELEMENTS.errorMessage.innerHTML = '';
        }
        function showLoader(text) {
            ELEMENTS.loaderText.textContent = text;
            ELEMENTS.loader.classList.remove('hidden');
            ELEMENTS.loader.classList.add('flex');
            ELEMENTS.resultsGrid.innerHTML = '';
        }
        function hideLoader() {
            ELEMENTS.loader.classList.add('hidden');
            ELEMENTS.loader.classList.remove('flex');
        }
        function cleanJSONString(str) {
            let s = str.trim();
            if (s.startsWith('```json')) s = s.substring(7);
            else if (s.startsWith('```')) s = s.substring(3);
            if (s.endsWith('```')) s = s.substring(0, s.length - 3);
            return s.trim();
        }
        async function fetchWithRetry(url, options = {}) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            let lastError;
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        let errMsg = `Помилка HTTP ${response.status}`;
                        let isRetryable = response.status === 503 || response.status === 429;
                        try {
                            const errData = await response.json();
                            if (errData.error?.message) {
                                errMsg = errData.error.message;
                                const msgLower = errMsg.toLowerCase();
                                if (msgLower.includes('high demand') || msgLower.includes('overloaded')) isRetryable = true;
                            }
                        } catch (e) {}
                        const error = new Error(errMsg);
                        error.isRetryable = isRetryable;
                        throw error;
                    }
                    return response;
                } catch (error) {
                    lastError = error;
                    if (error.isRetryable !== false && i < delays.length) {
                        await new Promise(resolve => setTimeout(resolve, delays[i]));
                    } else {
                        throw error;
                    }
                }
            }
            throw lastError;
        }

        ELEMENTS.searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const wishes = ELEMENTS.wishesInput.value.trim();
            if (!wishes) {
                showError('<b>Будь ласка, опишіть свої побажання.</b> Нам потрібен контекст для магії.');
                ELEMENTS.wishesInput.focus();
                return;
            }
            const selectedYearEls = Array.from(ELEMENTS.yearCheckboxList.querySelectorAll('input:checked')).map(el => el.value).filter(val => val !== 'any');
            const selectedGenreEls = Array.from(ELEMENTS.genreCheckboxList.querySelectorAll('input:checked')).map(el => el.value).filter(val => val !== 'any');
            const selectedYears = selectedYearEls.length > 0 ? selectedYearEls.join(', ') : 'Не має значення';
            const selectedGenres = selectedGenreEls.length > 0 ? selectedGenreEls.join(', ') : 'Не має значення';
            ELEMENTS.yearDropdownMenu.classList.add('hidden');
            ELEMENTS.genreDropdownMenu.classList.add('hidden');
            await processRecommendation(selectedYears, selectedGenres, wishes);
        });

        async function processRecommendation(year, genre, wishes) {
            showLoader('Нейромережі генерують підбірку...');
            try {
                const aiData = await fetchFromAI(year, genre, wishes);
                if (!aiData || aiData.length === 0) {
                    throw new Error('ШІ не зміг знайти жодного фільму під вказані критерії (спробуйте трохи розширити вибір років або жанрів).');
                }
                showLoader('Шукаємо круті постери та рейтинги...');
                const omdbResult = await fetchDetailsFromOMDb(aiData);
                const moviesWithDetails = omdbResult.moviesWithDetails;
                if (moviesWithDetails.length === 0) throw new Error('Не вдалося завантажити жодного результату з бази кіно.');
                moviesWithDetails.sort((a, b) => {
                    let ratingA = isNaN(parseFloat(a.imdbRating)) ? 0 : parseFloat(a.imdbRating);
                    let ratingB = isNaN(parseFloat(b.imdbRating)) ? 0 : parseFloat(b.imdbRating);
                    return ratingB - ratingA;
                });
                renderMovies(moviesWithDetails);
                hideLoader();
            } catch (error) {
                console.error("Помилка:", error);
                showError(`<b>Сталася помилка:</b> ${error.message}`);
            }
        }

        async function fetchFromAI(year, genre, wishes) {
            try {
                const response = await fetchWithRetry('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ year, genre, wishes })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const cleanJsonStr = cleanJSONString(data.text);
                const movies = JSON.parse(cleanJsonStr);
                if (!Array.isArray(movies)) throw new Error("Відповідь моделі не була масивом.");
                return movies;
            } catch (error) {
                throw new Error(`${error.message}`);
            }
        }

        async function fetchDetailsFromOMDb(aiMovies) {
            const promises = aiMovies.map(async (movie) => {
                if (!movie.title) return null;
                const fallbackMovie = { title: movie.title, originalTitleFromGemini: movie.title, year: movie.year || "N/A", poster: "https://via.placeholder.com/300x450/222222/4b5563?text=Постер+Відсутній", imdbRating: "-", imdbID: "", plotUA: movie.plot };
                try {
                    const yearParam = movie.year ? `&y=${encodeURIComponent(movie.year)}` : '';
                    let url = `https://www.omdbapi.com/?apikey=${OMDb_KEY}&t=${encodeURIComponent(movie.title)}${yearParam}&type=movie`;
                    let response = await fetchWithRetry(url);
                    let data = await response.json();
                    
                    // Якщо з роком не знайдено, пробуємо без року (можливо рік в базі відрізняється на 1)
                    if (data.Response !== "True" && movie.year) {
                        url = `https://www.omdbapi.com/?apikey=${OMDb_KEY}&t=${encodeURIComponent(movie.title)}&type=movie`;
                        response = await fetchWithRetry(url);
                        data = await response.json();
                    }

                    if (data.Response === "True") {
                        let isValidMatch = true;
                        if (movie.year) {
                            const aiYear = parseInt(movie.year.toString().substring(0, 4));
                            const omdbYear = parseInt(data.Year.substring(0, 4));
                            // Відхиляємо знахідку OMDb, якщо різниця в роках більше ніж 1 (уникаємо підміни однойменними старими фільмами)
                            if (!isNaN(aiYear) && !isNaN(omdbYear) && Math.abs(aiYear - omdbYear) > 1) {
                                isValidMatch = false;
                            }
                        }
                        
                        if (isValidMatch) {
                            return { title: data.Title, originalTitleFromGemini: movie.title, year: data.Year, poster: data.Poster !== "N/A" ? data.Poster : fallbackMovie.poster, imdbRating: data.imdbRating !== "N/A" ? data.imdbRating : "-", imdbID: data.imdbID, plotUA: movie.plot };
                        } else {
                            return fallbackMovie;
                        }
                    } else {
                        // Якщо зовсім не знайдено - повертаємо заглушку замість null
                        return fallbackMovie; 
                    }
                } catch (e) {
                    return fallbackMovie;
                }
            });
            const results = await Promise.all(promises);
            return { moviesWithDetails: results.filter(movie => movie !== null) };
        }

        function renderMovies(movies) {
            const fragment = document.createDocumentFragment();
            movies.forEach((movie, index) => {
                const node = document.importNode(ELEMENTS.template.content, true);
                const cardOuter = node.querySelector('.movie-card');
                
                cardOuter.style.animation = `fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.08}s`;
                cardOuter.style.opacity = '0';
                cardOuter.style.transform = 'translateY(30px)';
                
                node.querySelector('.card-poster').src = movie.poster;
                node.querySelector('.card-poster').alt = `Постер ${movie.title}`;
                node.querySelector('.card-rating').textContent = movie.imdbRating;
                node.querySelector('.card-year').textContent = movie.year;
                node.querySelector('.card-title').textContent = movie.title;
                node.querySelector('.card-title').title = movie.title;
                node.querySelector('.card-plot').textContent = movie.plotUA;
                
                if (movie.imdbID) node.querySelector('.card-imdb-btn').href = `https://www.imdb.com/title/${movie.imdbID}/`;
                else node.querySelector('.card-imdb-btn').href = `https://www.imdb.com/find?q=${encodeURIComponent(movie.title)}`;

                // Власний API-ендпоінт: він робить невидимий серверний запит, парсить видачу, знаходить лінк і миттєво перекидає користувача
                node.querySelector('.card-watch-btn').href = `/api/watch?title=${encodeURIComponent(movie.title)}&year=${encodeURIComponent(movie.year !== 'N/A' ? movie.year : '')}`;
                
                fragment.appendChild(node);
            });
            ELEMENTS.resultsGrid.appendChild(fragment);
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
