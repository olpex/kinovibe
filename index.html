<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#f97316',   /* Теплий помаранчевий */
                        secondary: '#fbbf24', /* Теплий бурштиновий */
                        accent: '#f43f5e',    /* М'який червоний/рожевий */

                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },

    <style>
        body {
            /* Теплий світлий бекграунд */
            background-color: #fdfaf6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%);

            color: #1f2937;
        }

        /* Glassmorphism для світлої теми */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);

        /* Елегантний скролбар */

        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, #f97316, #f43f5e);

        }

        /* Спінер */
        .loader {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-block;
            border-top: 4px solid rgba(249, 115, 22, 0.2);
            border-right: 4px solid transparent;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        .loader::after {
            content: '';  
            box-sizing: border-box;
            position: absolute;
            left: 0;
            top: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-bottom: 4px solid #f97316;
            border-left: 4px solid transparent;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }

        .glow-text {

    </style>
</head>

    <script>
        const ELEMENTS = {
            yearDropdownBtn: document.getElementById('yearDropdownBtn'),
            yearDropdownMenu: document.getElementById('yearDropdownMenu'),
            yearCheckboxList: document.getElementById('yearCheckboxList'),
            yearSelectedText: document.getElementById('yearSelectedText'),
            genreDropdownBtn: document.getElementById('genreDropdownBtn'),
            genreDropdownMenu: document.getElementById('genreDropdownMenu'),
            genreCheckboxList: document.getElementById('genreCheckboxList'),
            genreSelectedText: document.getElementById('genreSelectedText'),
            searchForm: document.getElementById('searchForm'),
            wishesInput: document.getElementById('wishesInput'),
            loader: document.getElementById('loader'),
            loaderText: document.getElementById('loaderText'),
            errorMessage: document.getElementById('errorMessage'),
            resultsGrid: document.getElementById('resultsGrid'),
            template: document.getElementById('movieCardTemplate')
        };

        const OMDb_KEY = '541f2a60'; // Вшитий ключ

        const GENRES = ["Комедія", "Драма", "Фантастика", "Екшн / Бойовик", "Жахи", "Трилер", "Мелодрама", "Кримінал", "Детектив", "Анімація", "Фентезі"];
        const MAX_AI_MOVIES_TO_PROCESS = 9;
        const AI_RECOMMENDATION_CACHE = new Map();
        const OMDB_CACHE = new Map();
        const GENRE_TO_OMDB = {
            "Комедія": ["comedy"],
            "Драма": ["drama"],
            "Фантастика": ["sci fi", "science fiction"],
            "Екшн / Бойовик": ["action"],
            "Жахи": ["horror"],
            "Трилер": ["thriller"],
            "Мелодрама": ["romance"],
            "Кримінал": ["crime"],
            "Детектив": ["mystery", "detective", "crime"],
            "Анімація": ["animation"],
            "Фентезі": ["fantasy"]
        };
        const THEME_STOP_WORDS = new Set([
            "щоб","хочу","хочеться","мені","для","дуже","щось","щось","або","про","під","після","коли","тому","бо","такий","така","таке","та","і","й","але","чи","що","це","цей","ця",
            "the","and","for","with","from","about","into","your","you","want","movie","film"
        ]);

        function normalizeText(value) {
            return (value || '')
                .toString()
                .toLowerCase()
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/['’`"]/g, '')
                .replace(/[^a-zа-яіїєґ0-9\s]/giu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function extractYearTokens(value) {
            const matches = (value || '').toString().match(/\b(?:19|20)\d{2}\b/g);
            return matches ? [...new Set(matches)] : [];
        }

        function getFirstYear(value) {
            const years = extractYearTokens(value);
            return years.length > 0 ? years[0] : null;
        }

        function mapGenresForOmdb(selectedGenres) {
            const mapped = selectedGenres.flatMap((genre) => GENRE_TO_OMDB[genre] || [normalizeText(genre)]);
            return [...new Set(mapped.map(normalizeText).filter(Boolean))];
        }

        function matchesYearFilter(movieYear, selectedYearSet) {
            if (!selectedYearSet || selectedYearSet.size === 0) return true;
            return extractYearTokens(movieYear).some((yearToken) => selectedYearSet.has(yearToken));
        }

        function matchesGenreFilter(movieGenre, selectedGenreTokens) {
            if (!selectedGenreTokens || selectedGenreTokens.length === 0) return true;
            const movieGenreTokens = (movieGenre || '')
                .split(',')
                .map((item) => normalizeText(item))
                .filter(Boolean);
            if (movieGenreTokens.length === 0) return false;
            return selectedGenreTokens.some((selectedToken) =>
                movieGenreTokens.some((movieToken) => movieToken.includes(selectedToken) || selectedToken.includes(movieToken))
            );
        }

        function extractThemeKeywords(wishes) {
            const tokens = normalizeText(wishes)
                .split(' ')
                .filter((token) => token.length >= 4 && !THEME_STOP_WORDS.has(token));
            return [...new Set(tokens)].slice(0, 14);
        }

        function extractThemePhrases(wishes) {
            return wishes
                .split(/[,.!?;:]+/)
                .map((part) => normalizeText(part))
                .filter((part) => part.length >= 8 && part.split(' ').length >= 2)
                .slice(0, 6);
        }

        function getThemeMatchInfo(movie, themeKeywords, themePhrases) {
            if (themeKeywords.length === 0 && themePhrases.length === 0) {
                return { isMatch: true, score: 1, keywordHits: 0, phraseHits: 0 };
            }

            const haystack = normalizeText(`${movie.title} ${movie.omdbPlot || ''} ${movie.aiPlotUA || ''} ${movie.omdbGenre || ''}`);
            if (!haystack) return { isMatch: false, score: 0, keywordHits: 0, phraseHits: 0 };

            let keywordHits = 0;
            let phraseHits = 0;

            themeKeywords.forEach((keyword) => {
                if (haystack.includes(keyword)) keywordHits += 1;
            });
            themePhrases.forEach((phrase) => {
                if (haystack.includes(phrase)) phraseHits += 1;
            });

            const weightedTotal = themeKeywords.length + themePhrases.length * 2;
            const weightedHits = keywordHits + phraseHits * 2;
            const score = weightedTotal > 0 ? weightedHits / weightedTotal : 0;
            const minKeywordHits = themeKeywords.length >= 8 ? 2 : themeKeywords.length >= 1 ? 1 : 0;
            const isMatch = phraseHits > 0 || keywordHits >= minKeywordHits || score >= 0.18;

            return { isMatch, score, keywordHits, phraseHits };
        }

        function deduplicateMovies(movies) {
            const uniqueMap = new Map();
            movies.forEach((movie) => {
                const key = movie.imdbID || `${normalizeText(movie.title)}_${getFirstYear(movie.year) || 'na'}`;
                const existing = uniqueMap.get(key);
                if (!existing || (movie.relevanceScore || 0) > (existing.relevanceScore || 0)) {
                    uniqueMap.set(key, movie);
                }
            });
            return Array.from(uniqueMap.values());
        }

        function limitAiMovies(aiMovies, limit = MAX_AI_MOVIES_TO_PROCESS) {
            const unique = [];
            const seen = new Set();
            for (const movie of aiMovies || []) {
                if (!movie?.title) continue;
                const key = `${normalizeText(movie.title)}_${getFirstYear(movie.year) || 'na'}`;
                if (seen.has(key)) continue;
                seen.add(key);
                unique.push(movie);
                if (unique.length >= limit) break;
            }
            return unique;
        }

        function buildAICacheKey(years, genres, wishes) {
            const sortedYears = [...(years || [])].map(String).sort();
            const sortedGenres = [...(genres || [])].map(String).sort();
            return JSON.stringify({
                years: sortedYears,
                genres: sortedGenres,
                wishes: normalizeText(wishes)
            });
        }

        function init() {
            populateYears();
            populateGenres();
            setupDropdowns();
        }

        function populateYears() {
            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= 1960; y--) {
                const label = document.createElement('label');
                label.className = "custom-checkbox flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer text-gray-700 hover:text-gray-900 transition-colors group";
                label.innerHTML = `
                    <div class="relative flex items-center">
                        <input type="checkbox" value="${y}" class="peer sr-only">
                        <div class="w-5 h-5 border border-gray-300 rounded flex items-center justify-center transition-colors group-hover:border-primary">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                    <span class="select-none font-medium">${y}</span>
                `;
                ELEMENTS.yearCheckboxList.appendChild(label);
            }
        }

        function populateGenres() {
            GENRES.forEach(genre => {
                const label = document.createElement('label');
                label.className = "custom-checkbox flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl cursor-pointer text-gray-700 hover:text-gray-900 transition-colors group";
                label.innerHTML = `
                    <div class="relative flex items-center">
                        <input type="checkbox" value="${genre}" class="peer sr-only">
                        <div class="w-5 h-5 border border-gray-300 rounded flex items-center justify-center transition-colors group-hover:border-primary">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                    <span class="select-none font-medium">${genre}</span>
                `;
                ELEMENTS.genreCheckboxList.appendChild(label);
            });
        }

        function setupDropdowns() {
            ELEMENTS.yearDropdownBtn.addEventListener('click', () => {
                ELEMENTS.yearDropdownMenu.classList.toggle('hidden');
                ELEMENTS.genreDropdownMenu.classList.add('hidden');
            });
            ELEMENTS.genreDropdownBtn.addEventListener('click', () => {
                ELEMENTS.genreDropdownMenu.classList.toggle('hidden');
                ELEMENTS.yearDropdownMenu.classList.add('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#yearDropdownContainer')) ELEMENTS.yearDropdownMenu.classList.add('hidden');
                if (!e.target.closest('#genreDropdownContainer')) ELEMENTS.genreDropdownMenu.classList.add('hidden');
            });
            setupCheckboxLogic(ELEMENTS.yearCheckboxList, ELEMENTS.yearSelectedText, 'Будь-який рік');
            setupCheckboxLogic(ELEMENTS.genreCheckboxList, ELEMENTS.genreSelectedText, 'Будь-який жанр');
        }

        function setupCheckboxLogic(listContainer, textElement, defaultText) {
            listContainer.addEventListener('change', (e) => {
                if (e.target.tagName !== 'INPUT') return;
                const checkboxes = Array.from(listContainer.querySelectorAll('input[type="checkbox"]'));
                const anyCb = checkboxes.find(cb => cb.value === 'any');
                const otherCbs = checkboxes.filter(cb => cb.value !== 'any');
                
                if (e.target === anyCb && anyCb.checked) {
                    otherCbs.forEach(cb => cb.checked = false);
                } else if (e.target !== anyCb && e.target.checked) {
                    anyCb.checked = false;
                }
                
                const checkedList = checkboxes.filter(cb => cb.checked);
                if (checkedList.length === 0) anyCb.checked = true;
                
                const selectedValues = checkboxes.filter(cb => cb.checked && cb.value !== 'any').map(cb => cb.value);
                if (selectedValues.length === 0) textElement.textContent = defaultText;
                else if (selectedValues.length <= 2) textElement.textContent = selectedValues.join(', ');
                else textElement.textContent = `Обрано: ${selectedValues.length}`;
            });
        }

        function showError(msg) {
            ELEMENTS.errorMessage.innerHTML = `
                <svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div class="text-left text-red-600">${msg}</div>
            `;
            ELEMENTS.errorMessage.classList.remove('hidden');
            ELEMENTS.loader.classList.add('hidden');
            ELEMENTS.loader.classList.remove('flex');
        }
        function hideError() {
            ELEMENTS.errorMessage.classList.add('hidden');
            ELEMENTS.errorMessage.innerHTML = '';
        }
        function showLoader(text) {
            ELEMENTS.loaderText.textContent = text;
            ELEMENTS.loader.classList.remove('hidden');
            ELEMENTS.loader.classList.add('flex');
            ELEMENTS.resultsGrid.innerHTML = '';
        }
        function hideLoader() {
            ELEMENTS.loader.classList.add('hidden');
            ELEMENTS.loader.classList.remove('flex');
        }
        function cleanJSONString(str) {
            let s = str.trim();
            if (s.startsWith('```json')) s = s.substring(7);
            else if (s.startsWith('```')) s = s.substring(3);
            if (s.endsWith('```')) s = s.substring(0, s.length - 3);
            return s.trim();
        }
        async function fetchWithRetry(url, options = {}, retryConfig = {}) {
            const delays = Array.isArray(retryConfig.delays) && retryConfig.delays.length > 0
                ? retryConfig.delays
                : [700, 1400, 2500];
            const timeoutMs = typeof retryConfig.timeoutMs === 'number' ? retryConfig.timeoutMs : 22000;
            const retryableStatuses = retryConfig.retryableStatuses || [429, 500, 502, 503, 504];
            let lastError;
            for (let i = 0; i <= delays.length; i++) {
                let timeoutId;
                try {
                    const controller = new AbortController();
                    timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    if (!response.ok) {
                        let errMsg = `Помилка HTTP ${response.status}`;
                        let isRetryable = retryableStatuses.includes(response.status);
                        try {
                            const errData = await response.json();
                            if (errData.error?.message) {
                                errMsg = errData.error.message;
                                const msgLower = errMsg.toLowerCase();
                                if (msgLower.includes('high demand') || msgLower.includes('overloaded')) isRetryable = true;
                            }
                        } catch (e) {}
                        const error = new Error(errMsg);
                        error.isRetryable = isRetryable;
                        throw error;
                    }
                    return response;
                } catch (error) {
                    lastError = error;
                    if (error.name === 'AbortError') {
                        const timeoutError = new Error(`Таймаут запиту (${timeoutMs} ms)`);
                        timeoutError.isRetryable = true;
                        lastError = timeoutError;
                    }
                    if (error.isRetryable !== false && i < delays.length) {
                        await new Promise(resolve => setTimeout(resolve, delays[i]));
                    } else {
                        throw lastError;
                    }
                } finally {
                    if (timeoutId) clearTimeout(timeoutId);
                }
            }
            throw lastError;
        }

        ELEMENTS.searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const wishes = ELEMENTS.wishesInput.value.trim();
            if (!wishes) {
                showError('<b>Будь ласка, опишіть свої побажання.</b> Нам потрібен контекст для магії.');
                ELEMENTS.wishesInput.focus();
                return;
            }
            const selectedYearEls = Array.from(ELEMENTS.yearCheckboxList.querySelectorAll('input:checked')).map(el => el.value).filter(val => val !== 'any');
            const selectedGenreEls = Array.from(ELEMENTS.genreCheckboxList.querySelectorAll('input:checked')).map(el => el.value).filter(val => val !== 'any');
            ELEMENTS.yearDropdownMenu.classList.add('hidden');
            ELEMENTS.genreDropdownMenu.classList.add('hidden');
            await processRecommendation(selectedYearEls, selectedGenreEls, wishes);
        });

        async function processRecommendation(selectedYears, selectedGenres, wishes) {
            showLoader('Нейромережі генерують підбірку...');
            try {
                const aiData = await fetchFromAI(selectedYears, selectedGenres, wishes);
                if (!aiData || aiData.length === 0) {
                    throw new Error('ШІ не зміг знайти жодного фільму під вказані критерії (спробуйте трохи розширити вибір років або жанрів).');
                }
                const limitedAiMovies = limitAiMovies(aiData);
                showLoader('Перевіряємо точність за темами, жанром і роком...');
                const omdbResult = await fetchDetailsFromOMDb(limitedAiMovies, { selectedYears, selectedGenres, wishes });
                const moviesWithDetails = deduplicateMovies(omdbResult.moviesWithDetails);
                if (moviesWithDetails.length === 0) throw new Error('За цими темами, жанром і роком точних збігів не знайдено. Спробуйте трохи розширити запит.');
                moviesWithDetails.sort((a, b) => {
                    const relevanceA = isNaN(parseFloat(a.relevanceScore)) ? 0 : parseFloat(a.relevanceScore);
                    const relevanceB = isNaN(parseFloat(b.relevanceScore)) ? 0 : parseFloat(b.relevanceScore);
                    if (relevanceB !== relevanceA) return relevanceB - relevanceA;
                    let ratingA = isNaN(parseFloat(a.imdbRating)) ? 0 : parseFloat(a.imdbRating);
                    let ratingB = isNaN(parseFloat(b.imdbRating)) ? 0 : parseFloat(b.imdbRating);
                    return ratingB - ratingA;
                });
                renderMovies(moviesWithDetails);
                hideLoader();
            } catch (error) {
                console.error("Помилка:", error);
                showError(`<b>Сталася помилка:</b> ${error.message}`);
            }
        }

        async function fetchFromAI(years, genres, wishes) {
            const yearText = years.length > 0 ? years.join(', ') : 'Не має значення';
            const genreText = genres.length > 0 ? genres.join(', ') : 'Не має значення';
            const cacheKey = buildAICacheKey(years, genres, wishes);
            if (AI_RECOMMENDATION_CACHE.has(cacheKey)) {
                return AI_RECOMMENDATION_CACHE.get(cacheKey);
            }
            try {
                const response = await fetchWithRetry('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        years,
                        genres,
                        year: yearText,
                        genre: genreText,
                        wishes
                    })
                }, {
                    delays: [800, 1500, 2600],
                    timeoutMs: 26000
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const cleanJsonStr = cleanJSONString(data.text);
                const movies = JSON.parse(cleanJsonStr);
                if (!Array.isArray(movies)) throw new Error("Відповідь моделі не була масивом.");
                AI_RECOMMENDATION_CACHE.set(cacheKey, movies);
                return movies;
            } catch (error) {
                throw new Error(`${error.message}`);
            }
        }

        async function fetchDetailsFromOMDb(aiMovies, filters = {}) {
            const selectedYearSet = new Set((filters.selectedYears || []).map((year) => String(year)));
            const selectedGenreTokens = mapGenresForOmdb(filters.selectedGenres || []);
            const themeKeywords = extractThemeKeywords(filters.wishes || '');
            const themePhrases = extractThemePhrases(filters.wishes || '');

            const promises = aiMovies.map(async (movie) => {
                if (!movie.title) return null;
                try {
                    const aiYear = getFirstYear(movie.year);
                    const cacheKey = `${normalizeText(movie.title)}_${aiYear || 'na'}`;
                    let cachedOmdbData = OMDB_CACHE.get(cacheKey);

                    if (!cachedOmdbData) {
                        const yearParam = aiYear ? `&y=${encodeURIComponent(aiYear)}` : '';
                        let url = `https://www.omdbapi.com/?apikey=${OMDb_KEY}&t=${encodeURIComponent(movie.title)}${yearParam}&type=movie`;
                        let response = await fetchWithRetry(url, {}, {
                            delays: [250, 600],
                            timeoutMs: 9000
                        });
                        let data = await response.json();
                        
                        // Якщо з роком не знайдено, пробуємо без року (можливо рік в базі відрізняється на 1)
                        if (data.Response !== "True" && aiYear) {
                            url = `https://www.omdbapi.com/?apikey=${OMDb_KEY}&t=${encodeURIComponent(movie.title)}&type=movie`;
                            response = await fetchWithRetry(url, {}, {
                                delays: [250, 600],
                                timeoutMs: 9000
                            });
                            data = await response.json();
                        }

                        if (data.Response !== "True") return null;

                        cachedOmdbData = {
                            title: data.Title,
                            year: data.Year || movie.year || "N/A",
                            poster: data.Poster !== "N/A" ? data.Poster : "https://via.placeholder.com/300x450/222222/4b5563?text=Постер+Відсутній",
                            imdbRating: data.imdbRating !== "N/A" ? data.imdbRating : "-",
                            imdbID: data.imdbID || "",
                            omdbGenre: data.Genre !== "N/A" ? data.Genre : "",
                            omdbPlot: data.Plot !== "N/A" ? data.Plot : ""
                        };
                        OMDB_CACHE.set(cacheKey, cachedOmdbData);
                    }

                    const omdbPrimaryYear = getFirstYear(cachedOmdbData.year);
                    if (aiYear && omdbPrimaryYear) {
                        const aiYearNum = parseInt(aiYear, 10);
                        const omdbYearNum = parseInt(omdbPrimaryYear, 10);
                        if (!isNaN(aiYearNum) && !isNaN(omdbYearNum) && Math.abs(aiYearNum - omdbYearNum) > 1) {
                            return null;
                        }
                    }

                    const movieCandidate = {
                        ...cachedOmdbData,
                        aiPlotUA: movie.plot || "",
                        displayPlot: cachedOmdbData.omdbPlot || movie.plot || "Опис відсутній."
                    };

                    if (!matchesYearFilter(movieCandidate.year, selectedYearSet)) return null;
                    if (!matchesGenreFilter(movieCandidate.omdbGenre, selectedGenreTokens)) return null;

                    const themeInfo = getThemeMatchInfo(movieCandidate, themeKeywords, themePhrases);
                    if (!themeInfo.isMatch) return null;

                    return {
                        ...movieCandidate,
                        relevanceScore: Number(themeInfo.score.toFixed(3))
                    };
                } catch (e) {
                    return null;
                }
            });
            const results = await Promise.all(promises);
            return { moviesWithDetails: results.filter(movie => movie !== null) };
        }

        function renderMovies(movies) {
            const fragment = document.createDocumentFragment();
            movies.forEach((movie, index) => {
                const node = document.importNode(ELEMENTS.template.content, true);
                const cardOuter = node.querySelector('.movie-card');
                
                cardOuter.style.animation = `fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.08}s`;
                cardOuter.style.opacity = '0';
                cardOuter.style.transform = 'translateY(30px)';
                
                node.querySelector('.card-poster').src = movie.poster;
                node.querySelector('.card-poster').alt = `Постер ${movie.title}`;
                node.querySelector('.card-rating').textContent = movie.imdbRating;
                node.querySelector('.card-year').textContent = movie.year;
                node.querySelector('.card-title').textContent = movie.title;
                node.querySelector('.card-title').title = movie.title;
                node.querySelector('.card-plot').textContent = movie.displayPlot || movie.aiPlotUA || 'Опис відсутній.';
                
                if (movie.imdbID) node.querySelector('.card-imdb-btn').href = `https://www.imdb.com/title/${movie.imdbID}/`;
                else node.querySelector('.card-imdb-btn').href = `https://www.imdb.com/find?q=${encodeURIComponent(movie.title)}`;

                // Власний API-ендпоінт: він робить невидимий серверний запит, парсить видачу, знаходить лінк і миттєво перекидає користувача
                node.querySelector('.card-watch-btn').href = `/api/watch?title=${encodeURIComponent(movie.title)}&year=${encodeURIComponent(movie.year !== 'N/A' ? movie.year : '')}&imdbID=${encodeURIComponent(movie.imdbID || '')}`;
                
                fragment.appendChild(node);
            });
            ELEMENTS.resultsGrid.appendChild(fragment);
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);

        document.addEventListener('DOMContentLoaded', init);
    </script>
